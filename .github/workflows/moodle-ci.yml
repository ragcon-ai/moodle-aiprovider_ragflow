name: moodle-plugin-ci

# Full plugin QA pipeline (prechecks + PHPUnit + Behat, pgsql + mariadb).
# Runs on demand (Actions -> Run workflow, branch main) or on a pull request.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        include:
          # The plugins support Moodle 5.0+ from a single line — test both the minimum (5.0) and the
          # current (5.2) core, each on pgsql + mariadb.
          - php: '8.3'
            moodle-branch: MOODLE_500_STABLE
            database: pgsql
          - php: '8.3'
            moodle-branch: MOODLE_500_STABLE
            database: mariadb
          - php: '8.3'
            moodle-branch: MOODLE_502_STABLE
            database: pgsql
          - php: '8.3'
            moodle-branch: MOODLE_502_STABLE
            database: mariadb

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, gd, zip, intl, soap, xmlrpc, mbstring, curl, xml
          ini-values: max_input_vars=5000
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> "$GITHUB_PATH"
          echo $(cd ci/vendor/bin; pwd) >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle + plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint
      - name: PHP Mess Detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd
      - name: Moodle Code Checker (phpcs)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0
      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0
      - name: Validate
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate
      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints
      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache
      - name: Grunt (JS/CSS/AMD)
        if: ${{ !cancelled() }}
        # Fails on JS/CSS lint ERRORS and a stale AMD build (matches the plugins
        # directory gate). ESLint *warnings* are shown but non-fatal, as upstream.
        run: moodle-plugin-ci grunt --show-lint-warnings
      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
      - name: Behat features
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome
